<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장값 — 간장·된장 일일 가격·행사</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a2618">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="장값">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ee;--surface:#fff;--line:#dedad2;--ink:#1f1a17;--muted:#6f665e;--soy:#4a2618;--miso:#b9822a;--ssg:#25588a;--gb:#2f7a4f;--up:#b03a2e;--down:#25588a;--chip:#f6eddc;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16120f;--surface:#211b17;--line:#3a312a;--ink:#f0ebe5;--muted:#a89d92;--soy:#d9a77f;--miso:#e0aa52;--ssg:#7fb0e0;--gb:#6fc493;--up:#ec7d70;--down:#7fb0e0;--chip:#3a2d1c;color-scheme:dark}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Noto Sans JP","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.5}
.jp{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--miso);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--soy)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--soy);color:#fff7ee}
header .wrap{padding-top:12px;padding-bottom:12px}
h1{margin:0;font-size:21px;letter-spacing:-.02em}
.meta{font-size:12.5px;opacity:.8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px}
.stat b{font-size:20px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.warn{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 12px;cursor:pointer;flex:1;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.search{flex:1 1 100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.toggles{display:flex;gap:14px;font-size:13.5px;color:var(--muted);margin:4px 0 10px}
.toggles label{display:flex;gap:5px;align-items:center;cursor:pointer}
.count{font-size:13px;color:var(--muted);margin:6px 0}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li>button{all:unset;display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:12px 2px;cursor:pointer}
li>button:focus-visible{outline:2px solid var(--miso)}
.nm{font-weight:500}
.mall{font-size:11.5px;font-weight:500;color:var(--c);margin-right:6px}
.pr{text-align:right;font-weight:700}
.sub{font-size:12.5px;color:var(--muted)}
.chg{text-align:right;font-size:12.5px}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.new{color:var(--miso)}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chip{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px}
.chip.end{text-decoration:line-through;opacity:.7}
.empty{padding:32px 6px;text-align:center;color:var(--muted)}
.detail{padding:6px 2px 14px;grid-column:1/-1}
.detail svg{width:100%;height:120px;display:block}
.detail a{color:var(--muted)}
.tbl{font-size:12.5px;color:var(--muted);margin-top:6px}
section.chgs h2{font-size:15px;margin:18px 0 6px}
.install{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.install button{margin-left:auto;border:0;border-radius:8px;padding:8px 12px;background:var(--soy);color:#fff7ee;cursor:pointer;flex:none}
.install .x{background:transparent;color:var(--muted);margin-left:0;padding:8px}
.offline{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><h1>장값</h1><div class="meta" id="meta">불러오는 중…</div></div></header>
<main class="wrap"><div id="install"></div><div id="app"></div></main>
<script>
const MALL={ssg:{name:"쓱닷컴",c:"var(--ssg)"},greenbeans:{name:"그린빈즈",c:"var(--gb)"}};
let D=null,H=null,C=null,st={mall:"all",cat:"all",view:"all",q:"",showEx:false,open:null};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,cur)=>v==null?"—":cur==="JPY"?"¥"+v.toLocaleString("ja-JP"):v.toLocaleString("ko-KR")+"원";

async function load(){
  try{
    const [l,h,c]=await Promise.all(["latest","history","changes"].map(n=>fetch(`data/${n}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null)));
    D=l;H=h||{};C=c||{};
    if(!D||!D.items){app.innerHTML=`<div class="empty">아직 수집된 데이터가 없어요. GitHub Actions에서 daily-crawl을 한 번 실행하세요.</div>`;document.getElementById("meta").textContent="데이터 없음";return;}
    document.getElementById("meta").textContent=`${D.date} 수집 (${D.generated_at.slice(11,16)} KST)`;
    render();
  }catch(e){app.innerHTML=`<div class="empty">데이터를 불러오지 못했어요. 페이지를 새로고침하세요.</div>`;}
}

function changeOf(id){
  if(!C)return null;
  const f=(k)=>(C[k]||[]).find(x=>(x.id||x)===id);
  let x;
  if(x=f("price_up"))return{cls:"up",t:`▲ ${money(x.to-x.from,curOf(id))}`};
  if(x=f("price_down"))return{cls:"down",t:`▼ ${money(x.from-x.to,curOf(id))}`};
  if(f("new"))return{cls:"new",t:"신규"};
  return null;
}
const curOf=id=>id.startsWith("gb:")?"JPY":"KRW";
const promoStarted=id=>(C?.promo_start||[]).find(x=>x.id===id)?.promos||[];
const promoEnded=id=>(C?.promo_end||[]).find(x=>x.id===id)?.promos||[];

function spark(id){
  const h=(H[id]||[]);
  if(h.length<2)return `<p class="tbl">가격 이력이 쌓이면 그래프가 표시돼요 (현재 ${h.length}일).</p>`;
  const w=600,ht=110,p=8,vs=h.map(x=>x[1]),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1;
  const pts=h.map((x,i)=>[p+i*(w-2*p)/(h.length-1),ht-p-(x[1]-mn)/rg*(ht-2*p)]);
  return `<svg viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" role="img" aria-label="가격 추이">
    <polyline fill="none" stroke="var(--soy)" stroke-width="2" points="${pts.map(q=>q.join(",")).join(" ")}"/>
    ${pts.map((q,i)=>h[i][2]?`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--miso)"/>`:"").join("")}
  </svg><p class="tbl num">${h[0][0]} ~ ${h[h.length-1][0]} | 최저 ${money(mn,curOf(id))} | 최고 ${money(mx,curOf(id))} | 주황 점 = 행사 중이던 날</p>`;
}

function render(){
  const q=st.q.trim().toLowerCase();
  let items=D.items.filter(i=>(st.showEx||!i.excluded)&&(st.mall==="all"||i.mall===st.mall)&&(st.cat==="all"||i.category===st.cat)&&(!q||[i.name,i.seller].join(" ").toLowerCase().includes(q)));
  if(st.view==="promo")items=items.filter(i=>i.promos&&i.promos.length);
  if(st.view==="chg")items=items.filter(i=>changeOf(i.id)||promoStarted(i.id).length||promoEnded(i.id).length);
  const s=D.stats||{};
  let html=`<div class="stats">${Object.entries(MALL).map(([k,m])=>`<div class="stat" style="--c:${m.c}"><b class="num">${s[k]?.total??0}</b> <span>${m.name} 상품 | 행사 중 ${s[k]?.on_promo??0}</span></div>`).join("")}</div>`;
  if(D.errors&&D.errors.length)html+=`<div class="warn">수집 경고: ${D.errors.map(esc).join(" / ")}</div>`;
  const removed=(C?.removed||[]);
  html+=`<div class="bar">
    <input class="search" type="search" id="q" placeholder="상품명·판매자 검색" value="${esc(st.q)}">
    <div class="seg" role="group" aria-label="몰">${[["all","전체"],["ssg","쓱닷컴"],["greenbeans","그린빈즈"]].map(([v,l])=>`<button data-k="mall" data-v="${v}" aria-pressed="${st.mall===v}">${l}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="분류">${[["all","전체"],["간장","간장"],["된장","된장"]].map(([v,l])=>`<button data-k="cat" data-v="${v}" aria-pressed="${st.cat===v}">${l}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="보기">${[["all","모든 상품"],["promo","행사 중"],["chg","오늘 변동"]].map(([v,l])=>`<button data-k="view" data-v="${v}" aria-pressed="${st.view===v}">${l}</button>`).join("")}</div>
  </div>
  <div class="toggles"><label><input type="checkbox" id="ex" ${st.showEx?"checked":""}> 비대상 상품(쯔유·폰즈 등) 보기</label></div>
  <p class="count num">${items.length}개 표시${C?.since?` | 변동 기준: ${C.since} 대비`:""}</p>`;
  if(!items.length)html+=`<div class="empty">조건에 맞는 상품이 없어요. 필터를 바꿔 보세요.</div>`;
  else html+=`<ul>${items.map(i=>{
    const m=MALL[i.mall],ch=changeOf(i.id),started=promoStarted(i.id),ended=promoEnded(i.id),open=st.open===i.id;
    const chips=[...(i.promos||[]).map(p=>`<span class="chip">${started.includes(p)?"NEW ":""}${esc(p)}</span>`),...ended.map(p=>`<span class="chip end">${esc(p)}</span>`)].join("");
    return `<li><button data-open="${esc(i.id)}" aria-expanded="${open}">
      <span><span class="mall" style="--c:${m.c}">${m.name}</span><span class="nm ${i.mall==="greenbeans"?"jp":""}">${esc(i.name)}</span></span>
      <span class="pr num">${money(i.price,i.currency)}</span>
      <span class="sub">${[i.category,i.size,i.seller,i.price_regular?`정상가 ${money(i.price_regular,i.currency)}`:"",i.stale?"오늘 미수집":"",i.excluded?"비대상":""].filter(Boolean).map(esc).join(" | ")}</span>
      <span class="chg num ${ch?.cls||""}">${ch?esc(ch.t):""}</span>
      ${chips?`<span class="chips">${chips}</span>`:""}
      </button>${open?`<div class="detail">${spark(i.id)}<p class="tbl">${i.unit_price?esc(i.unit_price)+" | ":""}${i.rating?`평점 ${i.rating}${i.reviews?` (${i.reviews})`:""} | `:""}<a href="${esc(i.url)}" target="_blank" rel="noopener">상품 페이지 열기</a></p></div>`:""}</li>`;
  }).join("")}</ul>`;
  if(removed.length&&st.view==="chg")html+=`<section class="chgs"><h2>사라진 상품 ${removed.length}개</h2><ul>${removed.map(r=>`<li><div style="padding:10px 2px"><span class="mall" style="--c:${MALL[r.mall]?.c}">${MALL[r.mall]?.name||""}</span>${esc(r.name)}</div></li>`).join("")}</ul></section>`;
  app.innerHTML=html;
  const qe=document.getElementById("q");
  qe.oninput=e=>{st.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);};
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{st[b.dataset.k]=b.dataset.v;render();});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{st.open=st.open===b.dataset.open?null:b.dataset.open;render();});
  document.getElementById("ex").onchange=e=>{st.showEx=e.target.checked;render();};
}
load();

// ── 앱 설치(홈 화면에 추가) ──
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let dismissed = false; try { dismissed = localStorage.getItem("installDismissed") === "1"; } catch(e){}
const box = document.getElementById("install");
function hideInstall(){ box.innerHTML=""; try{localStorage.setItem("installDismissed","1");}catch(e){} }
let deferred = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e;
  if (standalone || dismissed) return;
  box.innerHTML = `<div class="install"><span>장값을 앱으로 설치하면 홈 화면에서 바로 열 수 있어요.</span><button id="inst">설치</button><button class="x" id="instx" aria-label="닫기">✕</button></div>`;
  document.getElementById("inst").onclick = async () => { deferred.prompt(); await deferred.userChoice; hideInstall(); };
  document.getElementById("instx").onclick = hideInstall;
});
if (!standalone && !dismissed && /iphone|ipad|ipod/i.test(navigator.userAgent)) {
  box.innerHTML = `<div class="install"><span>앱으로 쓰려면 Safari 하단의 공유 버튼 → ‘홈 화면에 추가’를 누르세요.</span><button class="x" id="instx" aria-label="닫기">✕</button></div>`;
  document.getElementById("instx").onclick = hideInstall;
}
window.addEventListener("offline", () => { const m=document.getElementById("meta"); if(m && !m.textContent.includes("오프라인")) m.textContent += " | 오프라인: 마지막 데이터 표시 중"; });
</script>
</body>
</html>
